name = "etemen-contacto"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

# Route en /api/* del sitio. Custom Domain solo en api.etemen.cl
# (nunca Custom Domain sobre el apex: reemplaza el sitio).
routes = [
  { pattern = "etemen.cl/api/*", zone_name = "etemen.cl" },
  { pattern = "www.etemen.cl/api/*", zone_name = "etemen.cl" },
  { pattern = "etemen.cl/umbral*", zone_name = "etemen.cl" },
  { pattern = "www.etemen.cl/umbral*", zone_name = "etemen.cl" },
  { pattern = "etemen.cl/nexus*", zone_name = "etemen.cl" },
  { pattern = "www.etemen.cl/nexus*", zone_name = "etemen.cl" },
  { pattern = "etemen.cl/minimarket*", zone_name = "etemen.cl" },
  { pattern = "www.etemen.cl/minimarket*", zone_name = "etemen.cl" },
  { pattern = "etemen.cl/bodega*", zone_name = "etemen.cl" },
  { pattern = "www.etemen.cl/bodega*", zone_name = "etemen.cl" },
  { pattern = "api.etemen.cl", zone_name = "etemen.cl", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "etemen-contactos"
database_id = "cc25e404-9933-43b5-92ff-c93abcbe19e4"

[vars]
NOTIFY_TO = "hola@etemen.cl"

# Aviso de contactos a destino verificado de Email Routing (Gmail).
[[send_email]]
name = "EMAIL"
destination_address = "godoyleytonantonio@gmail.com"
