<?xml version="1.0" encoding="UTF-8"?>
<!-- INDAGO — Isotipo principal. Hormiga exploradora integrada con lupa. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Indago isotipo">

  <!-- Antena izquierda -->
  <path d="M47 28 Q34 14 22 8" stroke="#0D0D0D" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="20" cy="7" r="5" fill="#0D0D0D"/>

  <!-- Antena derecha (naranja) -->
  <path d="M73 28 Q86 14 98 8" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="100" cy="7" r="6.5" fill="#FF6B00"/>

  <!-- Cabeza / Lente de lupa -->
  <circle cx="60" cy="62" r="42" fill="#0D0D0D"/>

  <!-- Ojo izquierdo -->
  <circle cx="44" cy="56" r="13.5" fill="#FFFFFF"/>
  <circle cx="46.5" cy="59" r="6.8" fill="#0D0D0D"/>
  <circle cx="42" cy="53" r="3" fill="#FFFFFF"/>

  <!-- Ojo derecho -->
  <circle cx="76" cy="56" r="13.5" fill="#FFFFFF"/>
  <circle cx="78.5" cy="59" r="6.8" fill="#0D0D0D"/>
  <circle cx="74" cy="53" r="3" fill="#FFFFFF"/>

  <!-- Mango de lupa -->
  <line x1="92" y1="94" x2="113" y2="115" stroke="#0D0D0D" stroke-width="10" stroke-linecap="round"/>
  <!-- Detalle naranja en el mango -->
  <circle cx="112.5" cy="114.5" r="5" fill="#FF6B00"/>

</svg>
