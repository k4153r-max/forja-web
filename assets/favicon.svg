<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#0B1220"/>
  <!-- E-zigurat: spine -->
  <rect x="5" y="5" width="4" height="22" fill="#FFFFFF"/>
  <!-- Top bar: shortest -->
  <rect x="5" y="5" width="9" height="4" fill="#FFFFFF"/>
  <!-- Middle bar: medium -->
  <rect x="5" y="14" width="14" height="4" fill="#FFFFFF"/>
  <!-- Bottom bar: widest, copper = fundamento -->
  <rect x="5" y="23" width="20" height="4" fill="#D9A870"/>
</svg>
