<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="ETEMEN">
  <!-- Spine -->
  <rect x="9" y="9" width="8" height="45" fill="#1B2A4A"/>
  <!-- Top bar: shortest — cima del zigurat -->
  <rect x="9" y="9" width="20" height="9" fill="#1B2A4A"/>
  <!-- Middle bar: medium — segunda terraza -->
  <rect x="9" y="27" width="32" height="9" fill="#1B2A4A"/>
  <!-- Bottom bar: widest, copper — el fundamento -->
  <rect x="9" y="45" width="44" height="9" fill="#C4894A"/>
</svg>
