<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Hojear">
  <!-- Fondo claro (papel) -->
  <rect width="64" height="64" rx="14" fill="#F4F1EA"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#D95D39" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Libro abierto: dos hojas, un solo tono, lomo = hueco negativo -->
  <path d="M31 18
           C20 20 13 26 13 33
           C13 40 20 45 31 47
           Z" fill="#D95D39"/>

  <!-- Hoja derecha, esquina levantada = gesto de hojear -->
  <path d="M33 18
           C44 20 51 26 51 33
           C51 40 44 45 33 47
           Z
           M44 21 L50 27 L44 27 Z" fill="#D95D39" fill-rule="evenodd"/>
</svg>
