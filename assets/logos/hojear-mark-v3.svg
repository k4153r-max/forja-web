<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Hojear">
  <!-- Fondo papel claro (Ruta A: editorial de papel, sin marco oscuro) -->
  <rect width="64" height="64" rx="14" fill="#FAF7F2"/>

  <!-- Lomo del libro abierto: hueco negativo central -->
  <path d="M31 18
           C20 20 13 26 13 33
           C13 40 20 45 31 47
           Z" fill="none" stroke="#C4894A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Hoja izquierda -->
  <path d="M19 18
           C13 20 13 30 13 33
           C13 36 16 42 22 45
           Z" fill="none" stroke="#C4894A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Hoja derecha con esquina levantada = gesto de hojear -->
  <path d="M33 18
           C44 20 51 26 51 33
           C51 40 44 45 33 47
           Z" fill="none" stroke="#C4894A" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M44 21 L50 27 L44 27 Z" fill="none" stroke="#C4894A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>