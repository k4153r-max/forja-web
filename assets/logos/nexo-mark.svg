<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fondo -->
  <rect width="64" height="64" rx="14" fill="#080a0e"/>
  <!-- Borde sutil -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#D97706" stroke-width="1.2" stroke-opacity="0.28"/>

  <!-- La conexión: curva suave de abajo-izquierda a arriba-derecha -->
  <path d="M14 49 C14 22 50 42 50 15" stroke="#D97706" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Nodo origen: grande y sólido (el local/negocio) -->
  <circle cx="14" cy="49" r="7" fill="#D97706"/>

  <!-- Nodo destino: anillo con punto interior (el receptor/cliente) -->
  <circle cx="50" cy="15" r="6" stroke="#D97706" stroke-width="2.5" fill="#080a0e"/>
  <circle cx="50" cy="15" r="2.2" fill="#D97706"/>
</svg>
