# Sitio estático ETEMEN Studio + Nexo — plan Free en Render
# Blueprint: https://dashboard.render.com/blueprint/new?repo=https://github.com/k4153r-max/forja-web
services:
  - type: web
    name: forja-web
    runtime: static
    plan: free
    branch: master
    buildCommand: "true"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
