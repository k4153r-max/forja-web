<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hojear: lee clásicos, ensayos, historia, revistas educativas e investigación en español. Lector propio sin anuncios.">
  <title>Hojear — Lector y biblioteca digital</title>
  <link rel="icon" href="/assets/logos/hojear-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/logos/hojear-icon.jpg">
  <meta property="og:image" content="https://etemen.cl/assets/logos/hojear-icon.jpg">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap');
:root{--bg:#f5f1e8;--bg2:#ece6d7;--panel:#fbf8f0;--ink:#20292b;--ink2:#4c5655;--spruce:#22342f;--cris:#a9602f;--gold:#a4772a;--line:rgba(32,41,43,.14);--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Inter',ui-sans-serif,system-ui,'Segoe UI',sans-serif;--read-font:'Literata','Source Serif 4',Georgia,'Times New Roman',serif;--read-size:1.125rem;--read-lh:1.78;--read-measure:38rem;--read-gap:1.35em;--read-pad-x:clamp(1.25rem,5vw,3.5rem);--read-pad-y:clamp(2rem,5vh,3.5rem);--read-paper:#faf6ee;--read-ink:#2a2622;--read-muted:#6b635a;--read-accent:#9a5b32;--read-chrome:rgba(250,246,238,.92);--read-edge:rgba(42,38,34,.08);--read-shadow:0 24px 64px -28px rgba(42,38,34,.28)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:rgba(169,96,47,.22)}
.wrap{width:min(1160px,calc(100% - 44px));margin:auto}
h1,h2,h3{font-family:var(--serif);letter-spacing:-.04em;font-weight:600;color:var(--ink)}
.eyebrow{color:var(--cris);font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px}
.eyebrow:before{content:"";width:26px;height:1.5px;background:var(--cris);opacity:.55}
h1{font-size:clamp(2.9rem,6.5vw,6rem);line-height:.94;letter-spacing:-.05em;font-weight:600;margin:20px 0 22px;max-width:840px}
h2{font-size:clamp(2rem,4vw,3.5rem);line-height:1.02;margin:10px 0 14px;max-width:720px}
.lead{color:var(--ink2);font-size:1.09rem;line-height:1.72;max-width:560px}
/* NAV */
nav{height:74px;display:flex;align-items:center;background:rgba(243,241,232,.82);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;width:100%;justify-content:space-between;align-items:center;gap:20px}
.brand{display:inline-flex;align-items:center;gap:11px;font:700 1.28rem var(--serif);letter-spacing:-.02em}
.brand-logo{width:30px;height:30px;border-radius:8px;display:block;box-shadow:0 2px 8px rgba(143,74,36,.2)}
.mark{width:26px;height:32px;border-radius:2px 2px 11px 11px;background:linear-gradient(160deg,#c06a35,#8f4a24);position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 2px 6px rgba(143,74,36,.35)}
.mark:after{content:"";position:absolute;inset:7px 6px;border:1.5px solid rgba(255,248,236,.85);border-top:0;border-radius:0 0 2px 2px}
.nav-links{display:flex;align-items:center;gap:26px;font-size:.86rem;font-weight:640}
.nav-links a:not(.pill){color:var(--ink2);position:relative;padding:6px 0}
.nav-links a:not(.pill):hover{color:var(--ink)}
.nav-links a:not(.pill):after{content:"";position:absolute;left:0;bottom:2px;height:1.5px;width:0;background:var(--cris);transition:width .22s}
.nav-links a:not(.pill):hover:after{width:100%}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;background:var(--spruce);color:#f5f1e8;padding:10px 16px;font-size:.84rem;font-weight:750}
.pill:hover{background:#16231f}
/* buttons */
.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:99px;background:var(--spruce);color:#f7f3ea;padding:13px 20px;font-size:.9rem;font-weight:750;box-shadow:0 6px 18px rgba(34,50,45,.18);transition:transform .15s,box-shadow .15s}
.button:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(34,50,45,.26)}
.button.alt{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.button.alt:hover{border-color:var(--cris);color:var(--cris);transform:none}
/* hero */
.hero{padding:84px 0 70px;position:relative;overflow:hidden}
.hero:after{content:"LECTURA";position:absolute;z-index:-1;right:-26px;top:30px;color:rgba(169,96,47,.07);font:900 clamp(6rem,20vw,16rem)/.8 var(--serif);user-select:none;pointer-events:none}
.hero h1 em{font-style:italic;color:var(--cris)}
/* metrics */
.metrics{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2)}
.metrics .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.metric{min-height:136px;padding:24px 30px 24px 0;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.metric+.metric{padding-left:30px}
.metric:last-child{border:0}
.metric b{font:600 2.7rem/1 var(--serif);color:var(--ink);font-variation-settings:'opsz' 144}
.metric span{margin-top:9px;font-size:.8rem;color:var(--ink2);line-height:1.4;max-width:200px}
/* sections */
.section{padding:88px 0}
.head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:34px}
.text-link{color:var(--cris);font-size:.86rem;font-weight:750;border-bottom:1px solid currentColor;padding-bottom:3px;white-space:nowrap;transition:opacity .15s}
.text-link:hover{opacity:.75}
/* bookshelf */
.books{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.book{position:relative;min-height:300px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;border-radius:4px 4px 10px 10px;overflow:hidden;transition:transform .25s,box-shadow .25s;box-shadow:0 2px 0 rgba(0,0,0,.16),0 8px 22px -14px rgba(0,0,0,.35)}
.book:before{content:"";content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.22);border-right:1px solid rgba(255,255,255,.16)}
.book:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 80% 0,rgba(255,255,255,.14),transparent 60%)}
.book:hover{transform:translateY(-6px);box-shadow:0 2px 0 rgba(0,0,0,.16),0 26px 44px -18px rgba(0,0,0,.42)}
.book>*{position:relative;z-index:1}
.book small{font-size:.62rem;letter-spacing:.12em;font-weight:800;text-transform:uppercase;opacity:.85}
.book-title{font:600 2.15rem/.98 var(--serif);letter-spacing:-.05em;max-width:9.5ch;font-variation-settings:'opsz' 120}
.book-footer{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;font-weight:700}
.book-badge{position:absolute;right:14px;top:14px;z-index:2;font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.2)}
.circle{border:1px solid currentColor;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-weight:800;transition:transform .2s}
.book:hover .circle{transform:rotate(45deg)}
.blue{background:#2e6765;color:#f6ecd8}.red{background:#c24f31;color:#fff7e8}.yellow{background:#dfa93c;color:#22302a}.purple{background:#5d568f;color:#faf5ee}.brown{background:#7c563c;color:#fff5e6}.pink{background:#9d4a5e;color:#fff6ec}.navy{background:#33436b;color:#f4efe5}.green{background:#758b5c;color:#f3efe0}.copper{background:#a9602f;color:#fff8ef}
/* guide band */
.guide-band{background:var(--spruce);color:#f5f1e8}
.guide-grid{padding:78px 0;display:grid;grid-template-columns:1fr 1fr;gap:84px}
.guide-band .eyebrow{color:var(--gold)}
.guide-band p{line-height:1.7;color:rgba(245,241,232,.7);max-width:470px}
.steps{display:grid;align-content:center}
.step{border-top:1px solid rgba(245,241,232,.14);padding:18px 0;display:grid;grid-template-columns:50px 1fr;gap:14px}
.step b{font-family:var(--serif);color:var(--gold);font-size:1.15rem;font-variation-settings:'opsz' 60}
.step strong{display:block;font-size:.98rem;margin-bottom:4px;color:#f5f1e8;font-weight:680}
.step span{font-size:.85rem;line-height:1.47;color:rgba(245,241,232,.6)}
/* footer */
.footer{border-top:1px solid var(--line);padding:30px 0;color:var(--ink2);font-size:.78rem}
.foot{display:flex;justify-content:space-between;gap:20px}
/* inner pages */
.page{padding:60px 0 90px}
.crumb{color:var(--ink2);font-size:.85rem;margin-bottom:28px}
.crumb a{color:var(--cris)}
/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0 40px}
.filter{font:600 .83rem var(--sans);border:1px solid var(--line);border-radius:99px;padding:9px 15px;background:transparent;cursor:pointer;color:var(--ink2);transition:all .15s}
.filter:hover{border-color:var(--cris);color:var(--cris)}
.filter.active{background:var(--spruce);border-color:var(--spruce);color:#f5f1e8}
.catalogue-note{margin-top:28px;font-size:.8rem;line-height:1.6;color:var(--ink2)}
/* book page hero */
.book-hero{display:grid;grid-template-columns:320px 1fr;gap:72px;align-items:center}
.cover{height:420px;border-radius:4px 4px 12px 12px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.2),0 30px 50px -26px rgba(0,0,0,.5)}
.cover:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:rgba(0,0,0,.25);border-right:1px solid rgba(255,255,255,.14);border-radius:4px 0 0 12px}
.cover .book-title{font-size:3.3rem}
.meta{color:var(--ink2);font-size:.95rem;line-height:1.75}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.72rem;font-weight:700;margin:12px 6px 0 0;color:var(--ink2)}
.book-hero .actions{margin-top:26px}
/* teaser reader on book page */
.reader{margin-top:60px;background:var(--spruce);border-radius:16px;overflow:hidden;box-shadow:0 24px 60px -30px rgba(0,0,0,.5)}
.reader-top{display:flex;justify-content:space-between;align-items:center;padding:16px 30px;border-bottom:1px solid rgba(245,241,232,.12);color:var(--gold);font-size:.72rem;font-weight:800;letter-spacing:.16em}
.reader .reader-body{padding:44px min(9vw,110px) 56px;font:1.18rem/1.9 var(--serif);color:#eae5d6}
.reader .reader-body p:first-child:first-letter{float:left;font-size:4.3rem;line-height:.78;padding:10px 10px 0 0;color:var(--gold)}
.reader .reader-body p:first-child:first-line{color:rgba(234,229,214,.5)}
.notice{background:rgba(240,120,60,.14);padding:16px 20px;border-radius:8px;font:.86rem/1.5 var(--sans);color:#d9c5a8;margin:22px 0}/* guides */
.guide-list{display:grid;gap:14px;margin-top:34px}
.simple-btn{border:1px solid var(--ink);border-radius:99px;padding:9px 14px;font-size:.78rem;font-weight:750;white-space:nowrap;transition:all .15s}
.simple-btn:hover{border-color:var(--cris);color:var(--cris)}
.guide-card{border:1px solid var(--line);border-radius:12px;padding:22px 24px;display:grid;grid-template-columns:52px 1fr auto;gap:18px;align-items:center;background:var(--panel);box-shadow:0 1px 0 rgba(0,0,0,.02);transition:transform .18s,box-shadow .18s}
.guide-card:hover{transform:translateY(-2px);box-shadow:0 16px 34px -18px rgba(32,41,43,.3)}
.guide-card b{font:600 1.5rem var(--serif);color:var(--cris);font-variation-settings:'opsz' 80}
.guide-card h3{font-size:1.3rem;margin:0 0 4px}
.guide-card p{font-size:.84rem;line-height:1.5;color:var(--ink2);margin:0}
/* study / plans */
.study{display:grid;grid-template-columns:2fr 1fr;gap:22px;margin-top:36px}
.card{background:var(--panel);border:1px solid var(--line);padding:30px;border-radius:14px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.card h3{font-size:1.5rem;margin:0 0 13px}
.card p,.card li{color:var(--ink2);line-height:1.65;font-size:.92rem}
.question{padding:15px 0;border-top:1px solid var(--line);font-weight:650;font-size:.92rem}
.signup{max-width:660px;margin:24px auto;text-align:center}
.form{display:flex;gap:9px;padding:5px;border:1px solid var(--line);background:var(--panel);border-radius:99px;margin-top:28px;box-shadow:0 14px 30px -20px rgba(0,0,0,.35)}
.form input{min-width:0;flex:1;border:0;background:transparent;padding:8px 15px;font:inherit;outline:0}
.form button{border:0;border-radius:99px;background:var(--spruce);color:#f5f1e8;font:inherit;font-weight:750;padding:8px 18px;cursor:pointer}
/* ═══════════════════════════════════════════
   LECTOR INMERSIVO (inspirado en Foliate / Standard Ebooks / Kobo)
   · columna ~65ch · tipografía Literata · poco chrome · temas suaves
   ═══════════════════════════════════════════ */
body.reading-mode{background:var(--read-paper);color:var(--read-ink)}
body.reading-mode nav,
body.reading-mode .footer{display:none}
body.reading-mode .reader-page{min-height:100vh;padding:0;margin:0}
body.reading-mode .reader-page > .wrap{width:100%;max-width:none;margin:0;padding:0}
body.reading-mode .reader-crumb{display:none}

.reader-stage{
  min-height:100vh;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(169,96,47,.06), transparent 55%),
    var(--read-paper);
  color:var(--read-ink);
  transition:background .35s ease,color .35s ease;
}
.reader-topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px var(--read-pad-x);
  background:var(--read-chrome);
  backdrop-filter:blur(14px) saturate(1.1);
  -webkit-backdrop-filter:blur(14px) saturate(1.1);
  border-bottom:1px solid var(--read-edge);
  transition:opacity .25s,transform .25s,background .35s;
}
.reader-topbar.is-hidden{opacity:0;transform:translateY(-100%);pointer-events:none}
.reader-topbar .back{
  display:inline-flex;align-items:center;gap:8px;
  font:600 .84rem var(--sans);color:var(--read-muted);
  padding:8px 10px;border-radius:999px;border:1px solid transparent;
}
.reader-topbar .back:hover{color:var(--read-ink);border-color:var(--read-edge);background:rgba(0,0,0,.03)}
.reader-topbar .meta-mini{
  flex:1;min-width:0;text-align:center;
  font:500 .82rem/1.3 var(--sans);color:var(--read-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.reader-topbar .meta-mini strong{color:var(--read-ink);font-weight:650}
.reader-tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rtool{
  border:1px solid var(--read-edge);
  background:rgba(255,255,255,.45);
  border-radius:10px;
  min-width:38px;height:38px;padding:0 10px;
  cursor:pointer;color:var(--read-ink);
  font:650 .86rem var(--sans);
  transition:background .15s,border-color .15s,transform .12s;
}
.rtool:hover{border-color:rgba(154,91,50,.45);color:var(--read-accent);transform:translateY(-1px)}
.rtool.active{background:rgba(154,91,50,.12);border-color:rgba(154,91,50,.35);color:var(--read-accent)}
.rtool-size{font-size:.72rem;font-weight:700;color:var(--read-muted);padding:0 4px;min-width:44px;text-align:center}

.reader-settings{
  display:none;gap:14px;flex-wrap:wrap;align-items:center;
  padding:12px var(--read-pad-x) 14px;
  background:var(--read-chrome);
  border-bottom:1px solid var(--read-edge);
  font:500 .8rem var(--sans);color:var(--read-muted);
}
.reader-settings.open{display:flex !important}
.reader-settings label{display:inline-flex;align-items:center;gap:8px}
.reader-settings input[type=range]{width:110px;accent-color:var(--read-accent)}
.theme-pills{display:flex;gap:6px;flex-wrap:wrap}
.theme-pill{
  width:28px;height:28px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}
.theme-pill[data-theme=paper]{background:#faf6ee}
.theme-pill[data-theme=sepia]{background:#f0e2c4}
.theme-pill[data-theme=night]{background:#1c1f1d}
.theme-pill[data-theme=mist]{background:#e8eef2}
.theme-pill.active{border-color:var(--read-accent);box-shadow:0 0 0 2px rgba(154,91,50,.25)}

.reader-shell{position:relative;display:grid;grid-template-columns:1fr}
.reader-shell.with-toc{grid-template-columns:minmax(200px,240px) 1fr}
.reader-toc{
  position:sticky;top:58px;align-self:start;
  max-height:calc(100vh - 70px);overflow:auto;
  padding:18px 14px 28px 18px;
  border-right:1px solid var(--read-edge);
  background:rgba(0,0,0,.02);
}
.reader-toc[hidden]{display:none !important}
.reader-shell.with-toc .reader-toc[hidden]{display:none !important}
.reader-toc .toc-head{
  font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--read-accent);margin:0 0 12px;padding:0 6px;
}
.toc-list{display:grid;gap:2px}
.toc-item{
  text-align:left;border:0;background:transparent;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  font:500 .8rem/1.35 var(--sans);color:var(--read-muted);
}
.toc-item:hover{background:rgba(154,91,50,.1);color:var(--read-ink)}
.toc-empty{font-size:.8rem;color:var(--read-muted);margin:0;padding:0 6px}

/* Columna de lectura — medida cómoda (Standard Ebooks / Medium) */
.reader-body{
  width:min(var(--read-measure),100%);
  margin:0 auto;
  padding:var(--read-pad-y) var(--read-pad-x) 7rem;
  font-family:var(--read-font);
  font-size:var(--read-size);
  font-optical-sizing:auto;
  font-weight:400;
  line-height:var(--read-lh);
  color:var(--read-ink);
  text-align:left;
  text-wrap:pretty;
  hyphens:auto;
  -webkit-hyphens:auto;
  transition:font-size .15s,line-height .15s,max-width .2s,color .35s;
  animation:reader-in .45s ease both;
}
@keyframes reader-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reader-body p{
  margin:0 0 var(--read-gap);
  content-visibility:auto;
  contain-intrinsic-size:auto 6em;
}
.reader-body .p-cover{
  text-align:center;
  padding:clamp(1.5rem,6vh,3.5rem) 0 clamp(2rem,6vh,3.2rem);
  margin-bottom:clamp(1rem,3vh,2rem);
  border-bottom:1px solid var(--read-edge);
}
.reader-body .p-chapter{
  font-family:var(--serif);
  font-size:clamp(1.85rem,4.2vw,2.65rem);
  font-weight:600;
  line-height:1.15;
  letter-spacing:-.03em;
  margin:0 0 .55em;
  color:var(--read-ink);
}
.reader-body .p-author{
  letter-spacing:.14em;text-transform:uppercase;
  font:650 .72rem/1.4 var(--sans);
  color:var(--read-accent);margin:0;
}
.reader-body .p-h{
  text-align:center;
  margin:2.4em 0 1.15em;
  font-family:var(--serif);
  font-size:1.28em;font-weight:600;
  line-height:1.3;letter-spacing:-.02em;
  color:var(--read-accent);
  break-after:avoid;
}
.reader-body .p-h:before{
  content:"";display:block;width:28px;height:1px;
  background:var(--read-accent);opacity:.45;margin:0 auto 14px;
}
.reader-body .firstbit::first-letter{
  float:left;
  font-family:var(--serif);
  font-size:3.6em;font-weight:600;
  line-height:.82;
  color:var(--read-accent);
  padding:.08em .12em 0 0;
  font-optical-sizing:auto;
}
.reader-loading{
  text-align:center;color:var(--read-muted);
  padding:min(30vh,180px) 12px;font:500 1rem var(--sans);
}

/* Barra inferior de progreso */
.read-ctrl{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:40;width:min(520px,calc(100% - 28px));
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  background:var(--read-chrome);
  backdrop-filter:blur(16px);
  border:1px solid var(--read-edge);
  border-radius:999px;
  box-shadow:var(--read-shadow);
  transition:opacity .25s,transform .25s;
}
.read-ctrl[hidden]{display:none !important}
.read-ctrl.is-hidden{opacity:0;transform:translateX(-50%) translateY(120%);pointer-events:none}
.read-btn{
  border:0;background:rgba(0,0,0,.05);
  border-radius:50%;width:40px;height:40px;flex-shrink:0;
  font-size:1.45rem;line-height:1;cursor:pointer;color:var(--read-ink);
  transition:background .15s,transform .12s;
}
.read-btn:hover{background:rgba(154,91,50,.14);color:var(--read-accent);transform:scale(1.04)}
.read-btn:disabled{opacity:.28;cursor:default;transform:none;pointer-events:none}
.read-mid{flex:1;display:flex;flex-direction:column;gap:5px;align-items:center;min-width:0}
.read-progress{width:100%;height:4px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.read-fill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--read-accent),#c4894a);border-radius:99px;transition:width .28s ease}
.read-meta{font-size:.72rem;font-weight:650;color:var(--read-muted);letter-spacing:.04em}
.read-hint{display:none}

.reader-foot-links{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  padding:8px var(--read-pad-x) 100px;
}
.reader-foot-links .simple-btn{
  border-color:var(--read-edge);color:var(--read-muted);background:transparent;
}
.reader-foot-links .simple-btn:hover{border-color:var(--read-accent);color:var(--read-accent)}
.reader-credit{
  display:block;text-align:center;color:var(--read-muted);
  font-size:.7rem;opacity:.75;padding:0 16px 28px;
}

/* Temas del lector */
.reader-stage.theme-sepia{
  --read-paper:#f3e7cf;--read-ink:#3f3428;--read-muted:#7a6a55;
  --read-accent:#8b5a2b;--read-chrome:rgba(243,231,207,.94);
  --read-edge:rgba(63,52,40,.1);--read-shadow:0 20px 50px -24px rgba(63,52,40,.3);
}
.reader-stage.theme-night{
  --read-paper:#161a18;--read-ink:#d9d4c8;--read-muted:#8e968f;
  --read-accent:#d4a574;--read-chrome:rgba(22,26,24,.94);
  --read-edge:rgba(217,212,200,.1);--read-shadow:0 20px 50px -20px rgba(0,0,0,.55);
}
.reader-stage.theme-night .rtool{background:rgba(255,255,255,.04)}
.reader-stage.theme-night .read-btn{background:rgba(255,255,255,.06)}
.reader-stage.theme-mist{
  --read-paper:#eef2f5;--read-ink:#243038;--read-muted:#5d6b75;
  --read-accent:#3d6b7a;--read-chrome:rgba(238,242,245,.94);
  --read-edge:rgba(36,48,56,.1);
}
/* modo páginas vs scroll */
.reader-body.mode-pages{min-height:60vh}
.reader-body.mode-scroll .page-break{height:0;margin:2.5em 0;border:0;border-top:1px dashed var(--read-edge);opacity:.5}
.reader-body.mode-book{display:none}

/* ═══ LIBRO ABIERTO (hojas) ═══ */
.book-desk{
  display:none;
  perspective:2200px;
  padding:18px 16px 110px;
  min-height:calc(100vh - 58px);
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(ellipse 70% 55% at 50% 40%, rgba(0,0,0,.06), transparent 70%),
    linear-gradient(180deg, transparent, rgba(0,0,0,.04));
}
.reader-stage.mode-book .book-desk{display:flex}
.reader-stage.mode-book .reader-body{display:none}
.reader-stage.mode-book .reader-foot-links{padding-top:0}

.book-open{
  position:relative;
  display:grid;
  grid-template-columns:1fr 14px 1fr;
  width:min(1080px,100%);
  max-width:100%;
  min-height:min(72vh,640px);
  transform-style:preserve-3d;
  filter:drop-shadow(0 28px 40px rgba(0,0,0,.22));
  transition:transform .45s cubic-bezier(.22,.61,.36,1);
}
.book-open.is-flipping-next{animation:book-turn-next .55s ease}
.book-open.is-flipping-prev{animation:book-turn-prev .55s ease}
@keyframes book-turn-next{
  0%{transform:rotateY(0)}
  40%{transform:rotateY(-6deg) scale(.992)}
  100%{transform:rotateY(0) scale(1)}
}
@keyframes book-turn-prev{
  0%{transform:rotateY(0)}
  40%{transform:rotateY(6deg) scale(.992)}
  100%{transform:rotateY(0) scale(1)}
}

.book-spine{
  position:relative;
  z-index:3;
  background:linear-gradient(90deg,
    rgba(0,0,0,.18) 0%,
    rgba(0,0,0,.06) 35%,
    rgba(255,255,255,.08) 50%,
    rgba(0,0,0,.06) 65%,
    rgba(0,0,0,.16) 100%);
  box-shadow:inset 0 0 12px rgba(0,0,0,.12);
  border-radius:2px;
}

.book-leaf{
  position:relative;
  background:
    linear-gradient(90deg, rgba(0,0,0,.04), transparent 14%),
    linear-gradient(270deg, rgba(0,0,0,.03), transparent 12%),
    var(--read-paper);
  color:var(--read-ink);
  overflow:hidden;
  min-height:min(72vh,640px);
  display:flex;
  flex-direction:column;
}
.book-leaf.leaf-left{
  border-radius:6px 0 0 6px;
  box-shadow:inset -18px 0 28px -22px rgba(0,0,0,.25);
  transform-origin:right center;
}
.book-leaf.leaf-right{
  border-radius:0 6px 6px 0;
  box-shadow:inset 18px 0 28px -22px rgba(0,0,0,.22);
  transform-origin:left center;
}
/* borde de libro (tapa sutil) */
.book-leaf.leaf-left:before,
.book-leaf.leaf-right:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
}
.book-leaf.leaf-left:after{
  content:"";position:absolute;right:0;top:4%;bottom:4%;width:1px;
  background:rgba(0,0,0,.08);z-index:2;
}
.book-leaf.leaf-right:after{
  content:"";position:absolute;left:0;top:4%;bottom:4%;width:1px;
  background:rgba(0,0,0,.08);z-index:2;
}

.leaf-inner{
  flex:1;
  padding:clamp(1.4rem,3.2vw,2.4rem) clamp(1.2rem,2.8vw,2.2rem) 2.6rem;
  font-family:var(--read-font);
  font-size:calc(var(--read-size) * .92);
  line-height:var(--read-lh);
  overflow:hidden;
  text-wrap:pretty;
  hyphens:auto;
  -webkit-hyphens:auto;
  position:relative;z-index:2;
}
.leaf-inner p{margin:0 0 calc(var(--read-gap) * .92);content-visibility:auto}
.leaf-inner .p-cover{text-align:center;padding:12% 4% 8%;border:0}
.leaf-inner .p-chapter{
  font-family:var(--serif);
  font-size:clamp(1.5rem,2.6vw,2.1rem);
  font-weight:600;line-height:1.15;letter-spacing:-.03em;
  margin:0 0 .5em;color:var(--read-ink);
}
.leaf-inner .p-author{
  letter-spacing:.12em;text-transform:uppercase;
  font:650 .68rem/1.4 var(--sans);color:var(--read-accent);margin:0;
}
.leaf-inner .p-h{
  text-align:center;margin:1.4em 0 .9em;
  font-family:var(--serif);font-size:1.15em;font-weight:600;
  color:var(--read-accent);line-height:1.25;
}
.leaf-inner .p-h:before{
  content:"";display:block;width:22px;height:1px;
  background:var(--read-accent);opacity:.4;margin:0 auto 10px;
}
.leaf-inner .firstbit::first-letter{
  float:left;font-family:var(--serif);
  font-size:3.1em;font-weight:600;line-height:.82;
  color:var(--read-accent);padding:.06em .1em 0 0;
}
.leaf-num{
  position:absolute;bottom:12px;left:0;right:0;
  text-align:center;z-index:3;
  font:650 .68rem/1 var(--sans);letter-spacing:.08em;
  color:var(--read-muted);opacity:.75;user-select:none;
}
.leaf-empty{
  display:flex;align-items:center;justify-content:center;
  height:100%;min-height:280px;
  color:var(--read-muted);font:500 .9rem var(--sans);opacity:.55;
}

/* zonas clicables de hoja */
.book-hit{
  position:absolute;top:0;bottom:0;width:22%;z-index:5;cursor:pointer;
  background:transparent;border:0;padding:0;
}
.book-hit-left{left:0}
.book-hit-right{right:0}
.book-hit:hover{background:linear-gradient(90deg,rgba(154,91,50,.05),transparent)}
.book-hit-right:hover{background:linear-gradient(270deg,rgba(154,91,50,.05),transparent)}
.book-hit:focus-visible{outline:2px solid var(--read-accent);outline-offset:-4px}

.book-hint{
  text-align:center;font:500 .75rem var(--sans);color:var(--read-muted);
  margin:14px 0 0;opacity:.8;
}

/* night book edges */
.reader-stage.theme-night .book-leaf{
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}
.reader-stage.theme-night .book-spine{
  background:linear-gradient(90deg,#0d100f,#1a1f1c,#0d100f);
}

@media(max-width:860px){
  .reader-shell.with-toc{grid-template-columns:1fr}
  .reader-toc{
    position:fixed;inset:52px 12px auto 12px;z-index:50;
    max-height:min(60vh,420px);border:1px solid var(--read-edge);
    border-radius:14px;background:var(--read-paper);
    box-shadow:var(--read-shadow);
  }
  .reader-body{--read-size:1.05rem;--read-lh:1.72}
  .reader-topbar .meta-mini{display:none}
  .read-ctrl{bottom:12px;width:calc(100% - 20px);border-radius:18px}

  /* móvil: una sola hoja */
  .book-open{grid-template-columns:1fr;min-height:min(78vh,720px);width:min(440px,100%)}
  .book-spine,.book-leaf.leaf-left{display:none}
  .book-leaf.leaf-right{
    border-radius:8px;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.06);
    min-height:min(78vh,720px);
  }
  .book-leaf.leaf-right:after{display:none}
  .leaf-inner{font-size:calc(var(--read-size) * .98);padding:1.5rem 1.25rem 2.8rem}
  .book-hint{font-size:.7rem}
}
@media(min-width:900px){
  .reader-body{font-size:calc(var(--read-size) * 1.02)}
}
/* pend */
.pend{max-width:720px;margin:46px auto 74px;background:var(--panel);border:1px solid #e0d5c2;border-radius:16px;padding:56px 46px;text-align:center;box-shadow:0 30px 80px -40px rgba(0,0,0,.4)}
.pend-mark{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(160deg,#c06a35,#8f4a24);color:#fff;font-size:1.9rem;font-weight:800;display:flex;align-items:center;justify-content:center;break-inside:auto}
.pend-h1{font-family:var(--serif);font-size:clamp(1.9rem,4vw,2.8rem);margin:12px 0;color:var(--ink);font-weight:600}
.pend .lead{margin:0 auto 26px;max-width:520px;color:#5f6a66}
.pend-src{font-size:.85rem;color:#8a8378;margin-top:6px}
.pend-src a{color:var(--cris);font-weight:700;text-decoration:underline}
.pend-note{color:#9a8c78;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:26px}
.pend-actions{justify-content:center}
.pend .eyebrow{color:var(--cris)}
/* premium-pdf */
.premium-reader{border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -40px rgba(0,0,0,.5)}
.premium-reader{border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -40px rgba(0,0,0,.5)}
.premium-top{padding:16px 26px;background:var(--spruce);color:#f5f1e8;font-size:.78rem;font-weight:700;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;gap:12px}
.premium-tools{display:flex;gap:8px;align-items:center}
.premium-tools .simple-btn{color:#f5f1e8;border-color:rgba(245,241,232,.35)}
.premium-tools .simple-btn:hover{border-color:var(--gold);color:var(--gold)}
.premium-credit{padding:14px 26px;font-size:.78rem;color:var(--ink2);background:var(--panel);border-top:1px solid var(--line)}
/* responsive */
@media(max-width:900px){.book-hero{grid-template-columns:1fr;gap:40px}.cover{height:340px;max-width:340px}}
@media(max-width:720px){.nav-links a:not(.pill){display:none}.hero{padding:58px 0 52px}.metrics .wrap,.books,.guide-grid,.book-hero,.study{grid-template-columns:1fr}.metric+.metric,.metric{padding:20px 0;border-right:0;border-bottom:1px solid var(--line);min-height:auto}.metric:last-child{border-bottom:0}.section{padding:66px 0}.head{align-items:start;flex-direction:column}.book{min-height:250px}.guide-grid{gap:36px;padding:60px 0}.cover{width:min(300px,100%);height:340px}.guide-card{grid-template-columns:34px 1fr;gap:14px}.guide-card .simple-btn{grid-column:2}.form{border-radius:20px;flex-direction:column}.form button{width:100%}.reader-body{padding:34px 22px 48px;font-size:1.28rem}.read-hint{display:none}.reader-card{border-radius:0;border-left:0;border-right:0;margin-top:14px}.reader-head{flex-direction:column;align-items:flex-start;gap:14px}.foot{flex-direction:column;gap:8px}}
</style>
