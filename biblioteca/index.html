@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
:root{
  --bg:#0c0b0a;--bg2:#141311;--panel:#1c1a18;--panel-hover:#24211e;
  --ink:#E8E4D9;--ink2:rgba(232,228,217,.72);--ink3:rgba(232,228,217,.42);
  --line:rgba(232,228,217,.1);--line-strong:rgba(232,228,217,.22);
  --swiss-red:#D95D39;--swiss-red-glow:rgba(217,93,57,.18);--swiss-cyan:#E29D52;--gold:#E29D52;
  --display:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --serif:'Newsreader',Georgia,serif;
  --sans:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;
  --read-font:'Literata',Georgia,serif;
  --read-size:1.125rem;--read-lh:1.78;--read-measure:42rem;--read-gap:1.35em;
  --read-pad-x:clamp(1.25rem,5vw,3.5rem);--read-pad-y:clamp(2rem,5vh,3.5rem);
  --read-paper:#faf6ee;--read-ink:#2a2622;--read-muted:#6b635a;--read-accent:#D95D39;
  --read-chrome:rgba(250,246,238,.92);--read-edge:rgba(42,38,34,.08);--read-shadow:0 24px 64px -28px rgba(42,38,34,.28)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.06;background-image:url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');}
body.lib-mode{background:#08080a;color:#fff}
a{color:inherit;text-decoration:none}
::selection{background:var(--swiss-red);color:#fff}
.wrap{width:min(1240px,calc(100% - 40px));margin:auto}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;font-weight:600;color:#fff;text-transform:none}
.eyebrow{color:var(--swiss-red);font-size:.7rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono)}
.eyebrow:before{content:"[";color:var(--swiss-red);opacity:.7}
.eyebrow:after{content:"]";color:var(--swiss-red);opacity:.7}

/* NAV SUIZO */
nav{position:sticky;top:0;z-index:40;background:rgba(8,8,10,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:0 max(20px, env(safe-area-inset-right, 0px))}
nav .wrap.nav-in,.nav-in{display:flex;width:100%;max-width:1240px;margin:0 auto;min-height:64px;justify-content:space-between;align-items:center;gap:16px;position:relative}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.45rem;letter-spacing:-.02em;font-style:italic;color:#fff}
.brand-tag{font-family:var(--mono);font-size:.65rem;font-weight:600;letter-spacing:.1em;background:var(--swiss-red);color:#fff;padding:2px 6px}
.nav-links{display:flex;align-items:center;flex-wrap:nowrap;justify-content:flex-end;gap:20px}
.nav-links a{font-family:var(--mono);font-size:.76rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);transition:color .15s}
.nav-links a:hover{color:#fff}
.nav-links a.pill{color:#000;background:#fff;padding:7px 16px;border-radius:0;font-weight:600}
.nav-links a.pill:hover{color:#fff;background:var(--swiss-red)}
.nav-toggle{display:none;appearance:none;-webkit-appearance:none;min-height:36px;padding:6px 12px;margin:0;background:transparent;border:1px solid var(--line);color:#fff;font:500 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;flex-shrink:0}
.nav-toggle.open{border-color:var(--swiss-red);color:var(--swiss-red)}

/* TICKER */
.swiss-ticker{background:var(--bg2);border-bottom:1px solid var(--line);padding:8px 0;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--ink3)}
.swiss-ticker-in{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ticker-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;flex-shrink:0}

/* HERO SUIZO */
.swiss-hero{padding:72px 0 64px;border-bottom:1px solid var(--line)}
.swiss-hero-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:64px;align-items:center}
.swiss-h1{font-family:var(--display);font-size:clamp(2.6rem,6.4vw,5.2rem);font-weight:500;line-height:.95;letter-spacing:-.03em;text-transform:none;margin:0 0 20px;color:#fff}
.swiss-h1 em{font-style:normal;color:var(--swiss-red)}
.swiss-lead{font-size:1.05rem;line-height:1.6;color:var(--ink2);max-width:500px;margin:0 0 28px}
.swiss-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn-swiss{font-family:var(--sans);font-size:.9rem;font-weight:600;letter-spacing:.02em;text-transform:none;padding:14px 22px;border-radius:0;display:inline-flex;align-items:center;gap:8px;transition:all .15s}
.btn-swiss.btn-primary{background:var(--swiss-red);color:#fff;border:1px solid var(--swiss-red)}
.btn-swiss.btn-primary:hover{background:#ff5522;border-color:#ff5522;transform:translateY(-2px);box-shadow:0 8px 24px var(--swiss-red-glow)}
.btn-swiss.btn-ghost{background:transparent;color:#fff;border:1px solid var(--line-strong)}
.btn-swiss.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.05)}

/* SEARCH BOX */
.search-box-swiss{display:flex;align-items:center;border:1px solid var(--line-strong);background:var(--panel);padding:4px}
.search-prompt{font-family:var(--mono);font-size:1.1rem;color:var(--swiss-red);padding:0 14px;font-weight:700}
.search-box-swiss input{flex:1;border:0;background:transparent;color:#fff;font-family:var(--sans);font-size:1rem;padding:12px 0;outline:0}
.search-box-swiss input::placeholder{color:var(--ink3);font-size:.9rem}
.search-submit-swiss{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.08em;padding:10px 16px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line);cursor:pointer;transition:all .15s}
.search-submit-swiss:hover{background:var(--swiss-red);color:#fff;border-color:var(--swiss-red)}

/* METRICS */
.swiss-metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.sm-card{background:var(--panel);border:1px solid var(--line);padding:18px 14px}
.sm-num{font-family:var(--display);font-size:1.8rem;font-weight:800;letter-spacing:-.03em;color:#fff}
.sm-lbl{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;color:var(--ink3);margin-top:4px}

/* SECCIONES & GRID */
.swiss-section{padding:72px 0;border-bottom:1px solid var(--line)}
.swiss-sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px;gap:20px}
.swiss-h2{font-family:var(--display);font-size:clamp(1.6rem,3.6vw,2.4rem);font-weight:600;letter-spacing:-.02em;text-transform:none;margin:4px 0 0;color:#fff}
.swiss-sec-sub{font-size:.95rem;color:var(--ink2);margin:6px 0 0}
.swiss-link{font-family:var(--mono);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--swiss-red);border-bottom:1px solid var(--swiss-red);padding-bottom:2px;white-space:nowrap;transition:opacity .15s}
.swiss-link:hover{opacity:.8}

/* SPECIMEN BOOK CARDS */
.swiss-books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.book-card-swiss{display:flex;flex-direction:column;justify-content:space-between;min-height:250px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:0;text-decoration:none;position:relative;transition:all .2s cubic-bezier(.16,1,.3,1)}
.book-card-swiss:hover{transform:translateY(-4px);border-color:var(--swiss-red);background:var(--panel-hover);box-shadow:0 14px 36px rgba(0,0,0,.6),0 0 0 1px var(--swiss-red)}
.bcs-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--ink3);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.bcs-tag{color:var(--swiss-red);font-weight:600}
.book-card-swiss.is-magazine .bcs-tag{color:var(--gold)}
.bcs-body{flex:1;display:flex;flex-direction:column;justify-content:center}
.bcs-title{font-family:var(--serif);font-size:1.3rem;font-weight:600;font-style:italic;line-height:1.2;color:#fff;margin:0 0 8px;letter-spacing:-.01em}
.bcs-author{font-family:var(--sans);font-size:.85rem;color:var(--ink2)}
.bcs-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:16px;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--ink3)}
.bcs-badge{padding:3px 8px;font-weight:600;letter-spacing:.06em}
.bcs-badge.bcs-audio{background:rgba(0,229,255,.12);color:var(--swiss-cyan);border:1px solid rgba(0,229,255,.3)}
.bcs-badge.bcs-text{background:rgba(255,255,255,.05);color:var(--ink2);border:1px solid var(--line)}

/* BUTTONS LEGACY MAPPING */
.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:0;background:var(--swiss-red);color:#fff;padding:13px 20px;font-family:var(--mono);font-size:.82rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background .15s;border:1px solid var(--swiss-red)}
.button:hover{background:#ff5522}
.button.alt{background:transparent;color:#fff;border:1px solid var(--line-strong)}
.button.alt:hover{border-color:#fff;color:#fff}

/* CATÁLOGO SUIZO */
.swiss-cat-page{padding:48px 0 80px}
.swiss-crumb{font-family:var(--mono);font-size:.76rem;color:var(--ink3);letter-spacing:.08em;margin-bottom:24px}
.swiss-crumb a{color:var(--swiss-red)}
.swiss-search-bar{display:flex;align-items:center;border:1px solid var(--line-strong);background:var(--panel);margin:24px 0 16px;padding:4px}
.swiss-search-bar input{flex:1;border:0;background:transparent;color:#fff;font-family:var(--sans);font-size:1.05rem;padding:12px 0;outline:0}
.search-kbd{font-family:var(--mono);font-size:.65rem;color:var(--ink3);padding:0 14px}
.swiss-filter-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink2);padding:9px 14px;min-height:38px;font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:0;transition:all .15s}
.chip:hover{border-color:var(--swiss-red);color:#fff}
.chip.active{background:var(--swiss-red);border-color:var(--swiss-red);color:#fff}
.swiss-cat-meta-bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;color:var(--ink3)}

/* FOOTER SUIZO */
.footer{border-top:1px solid var(--line);padding:36px 0;color:var(--ink3);font-family:var(--mono);font-size:.75rem;letter-spacing:.06em}
.foot{display:flex;justify-content:space-between;gap:20px;align-items:center}
.foot a{color:var(--ink2);transition:color .15s}
.foot a:hover{color:var(--swiss-red)}
/* VISTA DE ESPECIMEN / FICHA DE LIBRO */
.swiss-book-page{padding:48px 0 80px}
.swiss-book-specimen{display:block;max-width:840px}
.sbs-card{background:var(--panel);border:1px solid var(--line-strong);padding:40px 36px;border-radius:0}
.sbs-card .bcs-head{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
.sbs-card .bcs-id{font-size:.8rem}
.sbs-card .bcs-tag{font-size:.78rem}

/* GUIDES & STUDY CARDS (SWISS) */
.guide-list{display:grid;gap:12px;margin-top:28px}
.simple-btn{border:1px solid var(--line-strong);border-radius:0;padding:9px 14px;font-family:var(--mono);font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:all .15s;background:transparent;color:#fff}
.simple-btn:hover{border-color:var(--swiss-red);color:var(--swiss-red)}
.guide-card{border:1px solid var(--line);border-radius:0;padding:22px 24px;display:grid;grid-template-columns:52px 1fr auto;gap:18px;align-items:center;background:var(--panel);transition:border-color .18s}
.guide-card:hover{transform:translateY(-2px);border-color:var(--swiss-red)}
.guide-card b{font:600 1.3rem var(--mono);color:var(--swiss-red)}
.guide-card h3{font-size:1.3rem;margin:0 0 4px;font-family:var(--serif)}
.guide-card p{font-size:.84rem;line-height:1.5;color:var(--ink2);margin:0}
/* ═══════════════════════════════════════════
   LECTOR INMERSIVO (inspirado en Foliate / Standard Ebooks / Kobo)
   · columna ~65ch · tipografía Literata · poco chrome · temas suaves
   ═══════════════════════════════════════════ */
body.reading-mode{background:var(--read-paper);color:var(--read-ink)}
body.reading-mode nav,
body.reading-mode .footer{display:none}
body.reading-mode .reader-page{min-height:100vh;padding:0;margin:0}
body.reading-mode .reader-page > .wrap{width:100%;max-width:none;margin:0;padding:0}
body.reading-mode .reader-crumb{display:none}

.reader-stage{
  min-height:100vh;
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(217,93,57,.08), transparent 55%),
    var(--read-paper);
  color:var(--read-ink);
  transition:background .35s ease,color .35s ease;
}
.reader-stage.mode-book{
  background:
    radial-gradient(ellipse 60% 50% at 50% 40%, rgba(217,93,57,.07), transparent 62%),
    #0c0b10;
}
.reader-topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px var(--read-pad-x);
  background:var(--read-chrome);
  backdrop-filter:blur(14px) saturate(1.1);
  -webkit-backdrop-filter:blur(14px) saturate(1.1);
  border-bottom:1px solid var(--read-edge);
  transition:opacity .25s,transform .25s,background .35s;
}
.reader-topbar.is-hidden{opacity:0;transform:translateY(-100%);pointer-events:none}
.reader-topbar .back{
  display:inline-flex;align-items:center;gap:8px;
  font:600 .84rem var(--sans);color:var(--read-muted);
  padding:8px 10px;border-radius:999px;border:1px solid transparent;
}
.reader-topbar .back:hover{color:var(--read-ink);border-color:var(--read-edge);background:rgba(0,0,0,.03)}
.reader-topbar .meta-mini{
  flex:1;min-width:0;text-align:center;
  font:500 .82rem/1.3 var(--sans);color:var(--read-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-decoration:none;
}
.reader-topbar .meta-mini strong{color:var(--read-ink);font-weight:650}
.reader-tools{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.rtool{
  border:1px solid var(--read-edge);
  background:rgba(255,255,255,.45);
  border-radius:10px;
  min-width:38px;height:38px;padding:0 10px;
  cursor:pointer;color:var(--read-ink);
  font:650 .86rem var(--sans);
}
.rtool:hover{border-color:rgba(154,91,50,.45);color:var(--read-accent)}
.rtool.active{background:rgba(154,91,50,.12);border-color:rgba(154,91,50,.35);color:var(--read-accent)}

.reader-settings{
  display:none;flex-direction:column;align-items:stretch;gap:14px;
  padding:16px var(--read-pad-x) 18px;
  background:var(--read-chrome);
  border-bottom:1px solid var(--read-edge);
  font:500 .88rem var(--sans);color:var(--read-muted);
}
.reader-settings.open{display:flex !important}
.set-row{display:flex;align-items:center;gap:10px}
.set-row>span{min-width:76px;color:var(--read-ink);font-weight:600}
.theme-choice{display:flex;gap:8px}
.theme-choice-btn{
  min-height:38px;padding:0 14px;border:1px solid var(--read-edge);
  background:transparent;color:var(--read-ink);font:600 .84rem var(--sans);cursor:pointer
}
.theme-choice-btn.active{background:rgba(154,91,50,.12);border-color:rgba(154,91,50,.35);color:var(--read-accent)}
.reader-toc-inline{max-height:200px;overflow:auto;border-top:1px solid var(--read-edge);padding-top:12px}
.reader-toc-inline[hidden]{display:none !important}
.reader-toc-inline .toc-head{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--read-accent);margin:0 0 8px}
.set-links{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--read-edge);padding-top:12px}
.set-links .simple-btn{border-color:var(--read-edge);color:var(--read-muted)}

.reader-shell{position:relative;display:grid;grid-template-columns:1fr}
.reader-shell.with-toc{grid-template-columns:minmax(200px,240px) 1fr}
.reader-toc{
  position:sticky;top:58px;align-self:start;
  max-height:calc(100vh - 70px);overflow:auto;
  padding:18px 14px 28px 18px;
  border-right:1px solid var(--read-edge);
  background:rgba(0,0,0,.02);
}
.reader-toc[hidden]{display:none !important}
.reader-shell.with-toc .reader-toc[hidden]{display:none !important}
.reader-toc .toc-head{
  font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--read-accent);margin:0 0 12px;padding:0 6px;
}
.toc-list{display:grid;gap:2px}
.toc-item{
  text-align:left;border:0;background:transparent;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  font:500 .8rem/1.35 var(--sans);color:var(--read-muted);
}
.toc-item:hover{background:rgba(154,91,50,.1);color:var(--read-ink)}
.toc-empty{font-size:.8rem;color:var(--read-muted);margin:0;padding:0 6px}

/* Columna de lectura — medida cómoda (Standard Ebooks / Medium) */
.reader-body{
  width:min(var(--read-measure),100%);
  margin:0 auto;
  padding:var(--read-pad-y) var(--read-pad-x) 7rem;
  font-family:var(--read-font);
  font-size:var(--read-size);
  font-optical-sizing:auto;
  font-weight:400;
  line-height:var(--read-lh);
  color:var(--read-ink);
  text-align:left;
  text-wrap:pretty;
  hyphens:auto;
  -webkit-hyphens:auto;
  transition:font-size .15s,line-height .15s,max-width .2s,color .35s;
  animation:reader-in .45s ease both;
}
.reader-image-page{
  width:min(100%, 58rem);margin:0 auto;padding:12px;text-align:center;
  background:#eee8dc;border:1px solid var(--read-edge);box-shadow:var(--read-shadow);
}
.reader-image-page img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;margin:auto}
.reader-image-page figcaption{padding:10px 4px 2px;color:var(--read-muted);font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase}
.reader-image-text{width:min(100%,58rem);margin:24px auto 0;border:1px solid var(--read-edge);background:var(--read-chrome);color:var(--read-ink);box-shadow:var(--read-shadow)}
.reader-image-text summary{padding:14px 18px;cursor:pointer;color:var(--read-accent);font:600 .82rem var(--sans);letter-spacing:.04em}
.reader-image-text>div{padding:8px clamp(18px,4vw,42px) 28px;text-align:left;max-height:70vh;overflow:auto}
.reader-image-text .p-h{color:var(--read-ink)}
.reader-image-text-scroll{margin-bottom:32px}
@keyframes reader-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reader-body p{
  margin:0 0 var(--read-gap);
  content-visibility:auto;
  contain-intrinsic-size:auto 6em;
}
.reader-body p[data-hl],
.leaf-inner p[data-hl]{cursor:pointer}
.reader-body p.is-hl,
.leaf-inner p.is-hl{
  background:rgba(217,93,57,.16);
  border-bottom:2px solid var(--hojear-terra, #D95D39);
  box-decoration-break:clone;
  -webkit-box-decoration-break:clone;
}
.reader-body .p-cover{
  text-align:center;
  padding:clamp(1.5rem,6vh,3.5rem) 0 clamp(2rem,6vh,3.2rem);
  margin-bottom:clamp(1rem,3vh,2rem);
  border-bottom:1px solid var(--read-edge);
}
.reader-body .p-chapter{
  font-family:var(--serif);
  font-size:clamp(1.85rem,4.2vw,2.65rem);
  font-weight:600;
  line-height:1.15;
  letter-spacing:-.03em;
  margin:0 0 .55em;
  color:var(--read-ink);
}
.reader-body .p-author{
  letter-spacing:.14em;text-transform:uppercase;
  font:650 .72rem/1.4 var(--sans);
  color:var(--read-accent);margin:0;
}
.reader-body .p-h{
  text-align:center;
  margin:2.4em 0 1.15em;
  font-family:var(--serif);
  font-size:1.28em;font-weight:600;
  line-height:1.3;letter-spacing:-.02em;
  color:var(--read-accent);
  break-after:avoid;
}
.reader-body .p-h:before{
  content:"";display:block;width:28px;height:1px;
  background:var(--read-accent);opacity:.45;margin:0 auto 14px;
}
.reader-body .firstbit::first-letter{
  float:left;
  font-family:var(--serif);
  font-size:3.6em;font-weight:600;
  line-height:.82;
  color:var(--read-accent);
  padding:.08em .12em 0 0;
  font-optical-sizing:auto;
}
.reader-loading{
  text-align:center;color:var(--read-muted);
  padding:min(30vh,180px) 12px;font:500 1rem var(--sans);
}

/* Barra inferior de progreso */
.read-ctrl{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:40;width:min(520px,calc(100% - 28px));
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  background:var(--read-chrome);
  backdrop-filter:blur(16px);
  border:1px solid var(--read-edge);
  border-radius:999px;
  box-shadow:var(--read-shadow);
  transition:opacity .25s,transform .25s;
}
.read-ctrl[hidden]{display:none !important}
.read-ctrl.is-hidden{opacity:0;transform:translateX(-50%) translateY(120%);pointer-events:none}
.read-btn{
  border:0;background:rgba(0,0,0,.05);
  border-radius:50%;width:40px;height:40px;flex-shrink:0;
  font-size:1.45rem;line-height:1;cursor:pointer;color:var(--read-ink);
  transition:background .15s,transform .12s;
}
.read-btn:hover{background:rgba(154,91,50,.14);color:var(--read-accent);transform:scale(1.04)}
.read-btn:disabled{opacity:.28;cursor:default;transform:none;pointer-events:none}
.read-mid{flex:1;display:flex;flex-direction:column;gap:5px;align-items:center;min-width:0}
.read-progress{width:100%;height:4px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.read-fill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--read-accent),#c4894a);border-radius:99px;transition:width .28s ease}
.read-meta{font-size:.72rem;font-weight:650;color:var(--read-muted);letter-spacing:.04em}
.read-hint{display:none}

.reader-foot-links{display:none}
.reader-credit{padding-bottom:96px}
.reader-foot-links .simple-btn{
  border-color:var(--read-edge);color:var(--read-muted);background:transparent;
}
.reader-foot-links .simple-btn:hover{border-color:var(--read-accent);color:var(--read-accent)}
.reader-credit{
  display:block;text-align:center;color:var(--read-muted);
  font-size:.7rem;opacity:.75;padding:0 16px 28px;
}

/* Temas del lector */
.reader-stage.theme-paper{
  --read-paper:#faf6ee;--read-ink:#2a2622;--read-muted:#6b635a;
  --read-accent:#9a5b32;--read-chrome:rgba(250,246,238,.92);
  --read-edge:rgba(42,38,34,.08);--read-shadow:0 24px 64px -28px rgba(42,38,34,.28);
}
.reader-stage.theme-sepia{
  --read-paper:#f4ecd8;--read-ink:#3a2f26;--read-muted:#7a6a55;
  --read-accent:#8c5324;--read-chrome:rgba(244,236,216,.94);
  --read-edge:rgba(58,47,38,.1);--read-shadow:0 20px 50px -24px rgba(58,47,38,.25);
}
.reader-stage.theme-night{
  --read-paper:#121514;--read-ink:#dcd7cc;--read-muted:#8e968f;
  --read-accent:#d4a574;--read-chrome:rgba(18,21,20,.94);
  --read-edge:rgba(220,215,204,.08);--read-shadow:0 20px 50px -20px rgba(0,0,0,.6);
}
.reader-stage.theme-night .rtool{background:rgba(255,255,255,.05)}
.reader-stage.theme-night .read-btn{background:rgba(255,255,255,.06)}
.reader-stage.theme-mist{
  --read-paper:#edf1f5;--read-ink:#243038;--read-muted:#5d6b75;
  --read-accent:#386b7a;--read-chrome:rgba(237,241,245,.94);
  --read-edge:rgba(36,48,56,.1);
}

/* Pantalla Completa / Zen Mode */
.reader-stage.is-zen .reader-topbar{
  opacity:0;transform:translateY(-100%);pointer-events:none;
}
.reader-stage.is-zen.show-chrome .reader-topbar,
.reader-stage.is-zen:hover .reader-topbar{
  opacity:1;transform:translateY(0);pointer-events:auto;
}
.reader-stage.is-zen .read-ctrl{
  opacity:0;transform:translateX(-50%) translateY(120%);pointer-events:none;
}
.reader-stage.is-zen.show-chrome .read-ctrl,
.reader-stage.is-zen:hover .read-ctrl{
  opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;
}
.reader-stage.is-zen .reader-body{
  padding-top:min(8vh, 60px);
  padding-bottom:min(12vh, 100px);
}
.zen-exit-hint{
  position:fixed;top:14px;right:14px;z-index:42;
  font:600 .75rem var(--sans);color:var(--read-muted);
  background:var(--read-chrome);border:1px solid var(--read-edge);
  padding:6px 12px;border-radius:999px;cursor:pointer;
  box-shadow:var(--read-shadow);opacity:.4;transition:all .2s ease;
  display:none;
}
.reader-stage.is-zen .zen-exit-hint{display:inline-flex;align-items:center;gap:6px}
.zen-exit-hint:hover{opacity:1;color:var(--read-accent);border-color:rgba(154,91,50,.35)}

/* Modos de visualización */
.mode-choice-btn{
  min-height:36px;padding:0 12px;border:1px solid var(--read-edge);
  background:transparent;color:var(--read-ink);font:600 .82rem var(--sans);cursor:pointer;
  border-radius:6px;transition:all .15s ease;
}
.mode-choice-btn:hover{border-color:var(--read-accent);color:var(--read-accent)}
.mode-choice-btn.active{background:rgba(154,91,50,.12);border-color:rgba(154,91,50,.35);color:var(--read-accent)}

.reader-stage.mode-page .book-desk{display:none !important}
.reader-stage.mode-page .reader-body{display:block !important;min-height:72vh;padding-bottom:130px}
.reader-stage.mode-scroll .book-desk{display:none !important}
.reader-stage.mode-scroll .reader-body{display:block !important;min-height:72vh;padding-bottom:130px}
.reader-stage.mode-book .book-desk{display:flex;padding-bottom:130px}
.reader-stage.mode-book .reader-body{display:none !important}

/* Columna de lectura limpia (Focus Mode) */
.reader-body{
  width:min(var(--read-measure, 44rem),calc(100% - 32px));
  margin:0 auto;
  padding:var(--read-pad-y) var(--read-pad-x) 130px;
  font-family:var(--read-font);
  font-size:var(--read-size);
  font-optical-sizing:auto;
  font-weight:400;
  line-height:var(--read-lh);
  color:var(--read-ink);
  text-align:left;
  text-wrap:pretty;
  hyphens:none !important;
  -webkit-hyphens:none !important;
  word-break:break-word;
  transition:font-size .15s,line-height .15s,max-width .2s,color .35s;
  animation:reader-in .35s ease both;
}

/* Botones flotantes de navegación lateral (notebook/desktop) */
.reader-side-btn{
  position:fixed;top:52%;transform:translateY(-50%);
  z-index:35;width:48px;height:76px;border:1px solid var(--read-edge);
  background:var(--read-chrome);color:var(--read-ink);
  border-radius:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font:300 2.2rem/1 var(--sans);transition:all .18s ease;
  box-shadow:var(--read-shadow);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:.75;
}
.reader-side-btn:hover{
  opacity:1;background:var(--read-chrome);color:var(--read-accent);
  border-color:rgba(154,91,50,.35);transform:translateY(-50%) scale(1.06);
}
.reader-side-btn:disabled{opacity:.12;cursor:default;pointer-events:none;transform:translateY(-50%)}
.reader-side-btn.side-prev{left:max(16px, calc((100vw - 860px) / 4))}
.reader-side-btn.side-next{right:max(16px, calc((100vw - 860px) / 4))}
.reader-stage.mode-scroll .reader-side-btn{display:none !important}

@media(max-width:960px){
  .reader-side-btn.side-prev{left:10px;width:40px;height:60px;font-size:1.6rem}
  .reader-side-btn.side-next{right:10px;width:40px;height:60px;font-size:1.6rem}
}
@media(max-width:640px){
  .reader-side-btn{display:none !important}
}

/* ═══ LIBRO ABIERTO (hojas) ═══ */
.book-desk{
  display:none;
  perspective:2200px;
  padding:18px 16px 110px;
  min-height:calc(100vh - 58px);
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(ellipse 70% 55% at 50% 40%, rgba(0,0,0,.06), transparent 70%),
    linear-gradient(180deg, transparent, rgba(0,0,0,.04));
}
.reader-stage.mode-book .book-desk{display:flex}
.reader-stage.mode-book .reader-body{display:none}
.reader-stage.mode-book .reader-foot-links{padding-top:0}

.book-open{
  position:relative;
  display:grid;
  grid-template-columns:1fr 14px 1fr;
  width:min(1080px,100%);
  max-width:100%;
  min-height:min(72vh,640px);
  transform-style:preserve-3d;
  filter:drop-shadow(0 28px 40px rgba(0,0,0,.22));
  transition:transform .45s cubic-bezier(.22,.61,.36,1);
}
.book-open.is-flipping-next{animation:book-turn-next .55s ease}
.book-open.is-flipping-prev{animation:book-turn-prev .55s ease}
@keyframes book-turn-next{
  0%{transform:rotateY(0)}
  40%{transform:rotateY(-6deg) scale(.992)}
  100%{transform:rotateY(0) scale(1)}
}
@keyframes book-turn-prev{
  0%{transform:rotateY(0)}
  40%{transform:rotateY(6deg) scale(.992)}
  100%{transform:rotateY(0) scale(1)}
}

.book-spine{
  position:relative;
  z-index:3;
  background:linear-gradient(90deg,
    rgba(0,0,0,.18) 0%,
    rgba(0,0,0,.06) 35%,
    rgba(255,255,255,.08) 50%,
    rgba(0,0,0,.06) 65%,
    rgba(0,0,0,.16) 100%);
  box-shadow:inset 0 0 12px rgba(0,0,0,.12);
  border-radius:2px;
}

.book-leaf{
  position:relative;
  background:
    linear-gradient(90deg, rgba(0,0,0,.04), transparent 14%),
    linear-gradient(270deg, rgba(0,0,0,.03), transparent 12%),
    var(--read-paper);
  color:var(--read-ink);
  overflow:hidden;
  min-height:min(72vh,640px);
  display:flex;
  flex-direction:column;
}
.book-leaf.leaf-left{
  border-radius:6px 0 0 6px;
  box-shadow:inset -18px 0 28px -22px rgba(0,0,0,.25);
  transform-origin:right center;
}
.book-leaf.leaf-right{
  border-radius:0 6px 6px 0;
  box-shadow:inset 18px 0 28px -22px rgba(0,0,0,.22);
  transform-origin:left center;
}
/* borde de libro (tapa sutil) */
.book-leaf.leaf-left:before,
.book-leaf.leaf-right:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
}
.book-leaf.leaf-left:after{
  content:"";position:absolute;right:0;top:4%;bottom:4%;width:1px;
  background:rgba(0,0,0,.08);z-index:2;
}
.book-leaf.leaf-right:after{
  content:"";position:absolute;left:0;top:4%;bottom:4%;width:1px;
  background:rgba(0,0,0,.08);z-index:2;
}

.leaf-inner{
  flex:1;
  padding:clamp(1.4rem,3.2vw,2.4rem) clamp(1.2rem,2.8vw,2.2rem) 2.6rem;
  font-family:var(--read-font);
  font-size:calc(var(--read-size) * .92);
  line-height:var(--read-lh);
  overflow:hidden;
  text-wrap:pretty;
  hyphens:auto;
  -webkit-hyphens:auto;
  position:relative;z-index:2;
}
.leaf-inner p{margin:0 0 calc(var(--read-gap) * .92);content-visibility:auto}
.leaf-inner .p-cover{text-align:center;padding:12% 4% 8%;border:0}
.leaf-inner .p-chapter{
  font-family:var(--serif);
  font-size:clamp(1.5rem,2.6vw,2.1rem);
  font-weight:600;line-height:1.15;letter-spacing:-.03em;
  margin:0 0 .5em;color:var(--read-ink);
}
.leaf-inner .p-author{
  letter-spacing:.12em;text-transform:uppercase;
  font:650 .68rem/1.4 var(--sans);color:var(--read-accent);margin:0;
}
.leaf-inner .p-h{
  text-align:center;margin:1.4em 0 .9em;
  font-family:var(--serif);font-size:1.15em;font-weight:600;
  color:var(--read-accent);line-height:1.25;
}
.leaf-inner .p-h:before{
  content:"";display:block;width:22px;height:1px;
  background:var(--read-accent);opacity:.4;margin:0 auto 10px;
}
.leaf-inner .firstbit::first-letter{
  float:left;font-family:var(--serif);
  font-size:3.1em;font-weight:600;line-height:.82;
  color:var(--read-accent);padding:.06em .1em 0 0;
}
.leaf-num{
  position:absolute;bottom:12px;left:0;right:0;
  text-align:center;z-index:3;
  font:650 .68rem/1 var(--sans);letter-spacing:.08em;
  color:var(--read-muted);opacity:.75;user-select:none;
}
.leaf-empty{
  display:flex;align-items:center;justify-content:center;
  height:100%;min-height:280px;
  color:var(--read-muted);font:500 .9rem var(--sans);opacity:.55;
}

/* zonas clicables de hoja */
.book-hit{
  position:absolute;top:0;bottom:0;width:22%;z-index:5;cursor:pointer;
  background:transparent;border:0;padding:0;
}
.book-hit-left{left:0}
.book-hit-right{right:0}
.book-hit:hover{background:linear-gradient(90deg,rgba(154,91,50,.05),transparent)}
.book-hit-right:hover{background:linear-gradient(270deg,rgba(154,91,50,.05),transparent)}
.book-hit:focus-visible{outline:2px solid var(--read-accent);outline-offset:-4px}

.book-hint{
  text-align:center;font:500 .75rem var(--sans);color:var(--read-muted);
  margin:14px 0 0;opacity:.8;
}

/* night book edges */
.reader-stage.theme-night .book-leaf{
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}
.reader-stage.theme-night .book-spine{
  background:linear-gradient(90deg,#0d100f,#1a1f1c,#0d100f);
}

@media(max-width:860px){
  .reader-shell.with-toc{grid-template-columns:1fr}
  .reader-toc{
    position:fixed;inset:52px 12px auto 12px;z-index:50;
    max-height:min(60vh,420px);border:1px solid var(--read-edge);
    border-radius:14px;background:var(--read-paper);
    box-shadow:var(--read-shadow);
  }
  .reader-body{--read-size:1.05rem;--read-lh:1.72}
  .reader-topbar .meta-mini{display:none}
  .read-ctrl{bottom:12px;width:calc(100% - 20px);border-radius:18px}

  /* móvil: una sola hoja */
  .book-open{grid-template-columns:1fr;min-height:min(78vh,720px);width:min(440px,100%)}
  .book-spine,.book-leaf.leaf-left{display:none}
  .book-leaf.leaf-right{
    border-radius:8px;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.06);
    min-height:min(78vh,720px);
  }
  .book-leaf.leaf-right:after{display:none}
  .leaf-inner{font-size:calc(var(--read-size) * .98);padding:1.5rem 1.25rem 2.8rem}
  .book-hint{font-size:.7rem}
}
@media(min-width:900px){
  .reader-body{font-size:calc(var(--read-size) * 1.02)}
}
/* pend */
.pend{max-width:720px;margin:46px auto 74px;background:var(--panel);border:1px solid #e0d5c2;border-radius:16px;padding:56px 46px;text-align:center;box-shadow:0 30px 80px -40px rgba(0,0,0,.4)}
.pend-mark{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(160deg,#c06a35,#8f4a24);color:#fff;font-size:1.9rem;font-weight:800;display:flex;align-items:center;justify-content:center;break-inside:auto}
.pend-h1{font-family:var(--serif);font-size:clamp(1.9rem,4vw,2.8rem);margin:12px 0;color:var(--ink);font-weight:600}
.pend .lead{margin:0 auto 26px;max-width:520px;color:#5f6a66}
.pend-src{font-size:.85rem;color:#8a8378;margin-top:6px}
.pend-src a{color:var(--cris);font-weight:700;text-decoration:underline}
.pend-note{color:#9a8c78;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:26px}
.pend-actions{justify-content:center}
.pend .eyebrow{color:var(--cris)}
/* premium-pdf */
.premium-reader{border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -40px rgba(0,0,0,.5)}
.premium-reader{border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -40px rgba(0,0,0,.5)}
.premium-top{padding:16px 26px;background:var(--spruce);color:#f5f1e8;font-size:.78rem;font-weight:700;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;gap:12px}
.premium-tools{display:flex;gap:8px;align-items:center}
.premium-tools .simple-btn{color:#f5f1e8;border-color:rgba(245,241,232,.35)}
.premium-tools .simple-btn:hover{border-color:var(--gold);color:var(--gold)}
.premium-credit{padding:14px 26px;font-size:.78rem;color:var(--ink2);background:var(--panel);border-top:1px solid var(--line)}
/* responsive */
.libro-hits{color:var(--ink2);font-size:.88rem;margin:10px 0 0}
.listen-h1{font-size:clamp(2.4rem,5vw,4rem);margin:8px 0 10px;font-family:var(--display);color:#fff}
.au-box{margin:28px 0 22px;padding:28px 24px;border:1px solid var(--line-strong);background:var(--panel);max-width:580px;border-radius:0}
.au-play{display:block;width:100%;min-height:52px;border:1px solid var(--swiss-red);background:var(--swiss-red);color:#fff;font-family:var(--mono);font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.au-play:hover{background:#ff5522;transform:translateY(-2px);box-shadow:0 8px 24px var(--swiss-red-glow)}
.au-now{margin:16px 0 10px;color:var(--ink2);font-family:var(--mono);font-size:.85rem;line-height:1.45}
.au-seek{width:100%;accent-color:var(--swiss-red);cursor:pointer}
.au-times{display:flex;justify-content:space-between;margin:6px 0 16px;color:var(--ink3);font-family:var(--mono);font-size:.74rem}
.au-skip{display:flex;gap:8px;flex-wrap:wrap}
.au-count{color:var(--ink3);font-family:var(--mono);font-size:.78rem;margin:8px 0 12px;letter-spacing:.06em}
.au-list{list-style:none;margin:0 0 24px;padding:0;max-height:min(48vh,420px);overflow:auto;border-top:1px solid var(--line)}
.au-item{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink2);font-family:var(--mono);font-size:.82rem;cursor:pointer;transition:all .15s}
.au-item:hover{color:#fff;background:rgba(255,255,255,.04);border-color:var(--swiss-red)}
.au-item.active{color:var(--swiss-cyan);font-weight:600;background:rgba(0,229,255,.06)}
.au-item-n{color:var(--ink3);font-size:.74rem}
.au-item-t{font-size:.84rem}
.au-item-d{color:var(--ink3);font-size:.74rem}

/* REPRODUCTOR FLOTANTE DE AUDIO (SWISS CONSOLE) */
.reader-audio-bar{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
  z-index:45;width:min(580px,calc(100% - 24px));
  display:flex;flex-direction:column;gap:8px;
  padding:12px 16px;
  background:rgba(18,18,22,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line-strong);
  border-radius:0;
  box-shadow:0 20px 50px rgba(0,0,0,.7);
  transition:opacity .25s,transform .25s;
}
.reader-audio-bar[hidden]{display:none !important}
.reader-audio-bar.is-hidden{opacity:0;transform:translateX(-50%) translateY(120%);pointer-events:none}
.rab-row{display:flex;align-items:center;gap:10px;justify-content:space-between;width:100%}
.rab-info{flex:1;min-width:0;font-family:var(--mono);font-size:.74rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.rab-info strong{color:var(--swiss-red);font-weight:700;margin-right:6px}
.rab-controls{display:flex;align-items:center;gap:6px}
.rab-btn{
  border:1px solid var(--line-strong);background:rgba(255,255,255,.05);
  border-radius:0;padding:5px 10px;font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;cursor:pointer;min-height:30px;display:inline-flex;align-items:center;gap:4px;transition:all .15s;
}
.rab-btn:hover{background:var(--swiss-red);border-color:var(--swiss-red);color:#fff}
.rab-btn.play-btn{width:32px;height:32px;padding:0;justify-content:center;font-size:1.1rem;background:var(--swiss-red);color:#fff;border:0}
.rab-btn.play-btn:hover{background:#ff5522;transform:scale(1.05)}
.rab-progress{display:flex;align-items:center;gap:10px;width:100%;font-family:var(--mono);font-size:.68rem;color:var(--ink3);letter-spacing:.06em}
.rab-progress input[type=range]{flex:1;height:4px;accent-color:var(--swiss-red);cursor:pointer}
.au-speed-btn{font-family:var(--mono);font-size:.74rem;font-weight:600;padding:6px 12px;border-radius:0;border:1px solid var(--line-strong);background:transparent;color:#fff;cursor:pointer;transition:all .15s}
.au-speed-btn:hover{border-color:var(--swiss-red);color:var(--swiss-red)}

@media(max-width:900px){.swiss-hero-grid{grid-template-columns:1fr;gap:40px}}
@media(max-width:720px){
  .nav-toggle{display:flex}
  .nav-links{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:0;padding:8px 0 16px;background:rgba(8,8,10,.98);border-bottom:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.7)}
  .nav-links.open{display:flex}
  .nav-links a{padding:14px 16px;border-bottom:1px solid var(--line)}
  .nav-links a.pill{margin:12px 16px 0;align-self:flex-start}
  .swiss-hero{padding:48px 0 44px}
  .swiss-metrics-grid{grid-template-columns:1fr}
  .swiss-section{padding:54px 0}
  .swiss-sec-head{align-items:flex-start;flex-direction:column;gap:12px}
  .swiss-books-grid{grid-template-columns:1fr}
  .foot{flex-direction:column;gap:10px;text-align:center}
}
</style>
