  <title>Umbral — Biblioteca para leer mejor</title>
  <style>
    :root{--ink:#172021;--paper:#f7f2e9;--deep:#ebe1d0;--orange:#d95d39;--sun:#e7a83d;--line:rgba(23,32,33,.15);--muted:rgba(23,32,33,.67);--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}nav{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;background:rgba(247,242,233,.94);position:sticky;top:0;z-index:9;backdrop-filter:blur(10px)}.nav-in{display:flex;width:100%;justify-content:space-between;align-items:center;gap:20px}.brand{display:inline-flex;align-items:center;gap:11px;font:800 1.3rem var(--serif);letter-spacing:-.03em}.mark{width:27px;height:31px;border-radius:1px 1px 9px 9px;background:var(--orange);position:relative}.mark:after{content:"";position:absolute;inset:6px 7px;border:1.5px solid var(--paper);border-top:0}.nav-links{display:flex;align-items:center;gap:24px;font-size:.84rem;font-weight:700}.nav-links a:not(.pill){opacity:.72}.pill,.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;background:var(--ink);color:var(--paper);padding:12px 17px;font-size:.88rem;font-weight:750}.hero{padding:80px 0 65px;position:relative;overflow:hidden}.hero:after{content:"LECTURA";position:absolute;z-index:-1;right:-24px;top:28px;color:rgba(217,93,57,.07);font:900 clamp(6rem,20vw,16rem)/.8 var(--serif)}.eyebrow{color:var(--orange);font-size:.7rem;font-weight:850;letter-spacing:.13em;text-transform:uppercase}h1,h2,h3{font-family:var(--serif);letter-spacing:-.055em}h1{max-width:800px;font-size:clamp(3.1rem,7vw,6.25rem);line-height:.93;margin:17px 0 22px}h2{font-size:clamp(2.15rem,4vw,3.7rem);line-height:.98;margin:9px 0 16px}.lead{max-width:555px;line-height:1.7;color:var(--muted);font-size:1.06rem}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.metrics{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--deep)}.metrics .wrap{display:grid;grid-template-columns:repeat(3,1fr)}.metric{min-height:128px;padding:24px 32px 24px 0;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}.metric+ .metric{padding-left:32px}.metric:last-child{border:0}.metric b{font:800 2.35rem/1 var(--serif)}.metric span{margin-top:8px;font-size:.8rem;color:var(--muted)}.section{padding:84px 0}.head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:28px}.text-link{color:var(--orange);font-size:.86rem;font-weight:750;border-bottom:1px solid currentColor;padding-bottom:3px;white-space:nowrap}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.book{min-height:290px;padding:21px;display:flex;flex-direction:column;justify-content:space-between;border-radius:5px;transition:transform .2s}.book:hover{transform:translateY(-5px)}.book small{font-size:.65rem;letter-spacing:.11em;font-weight:800;text-transform:uppercase}.book-title{font:800 2.05rem/.95 var(--serif);letter-spacing:-.06em;max-width:9ch}.book-footer{display:flex;justify-content:space-between;align-items:center;font-size:.74rem;font-weight:700}.circle{border:1px solid currentColor;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}.blue{background:#2e6765;color:#f8eedc}.red{background:#d85a38;color:#fff7e8}.yellow{background:#e4ae42;color:#1b2929}.purple{background:#675e9a;color:#faf5ee}.brown{background:#805a3e;color:#fff6e8}.pink{background:#a44e62;color:#fff6ec}.navy{background:#36486f;color:#f6f1e7}.green{background:#78905c;color:#102321}.guide-band{background:var(--ink);color:var(--paper)}.guide-grid{padding:74px 0;display:grid;grid-template-columns:1fr 1fr;gap:80px}.guide-band p{line-height:1.65;color: ection:column}.form button{width:100%}.foot{flex-direction:column;gap:8px}}
  
.reader-card{max-width:780px;margin:34px auto 60px;background:#fffdf8;border:1px solid #e3d8c6;border-radius:8px;box-shadow:0 24px 70px rgba(70,45,18,.10);overflow:hidden}.reader-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap;padding:30px 40px 22px;border-bottom:1px solid #ece1d0;background:linear-gradient(180deg,#fbf6ec,#f4ead8)}.reader-title{min-width:220px}.reader-h1{font-family:var(--serif);font-size:clamp(1.9rem,4vw,2.9rem);letter-spacing:-.04em;margin:8px 0 4px;color:#172021}.reader-sub{color:#6b5e51;font-size:.85rem;font-weight:700}.reader-tools{display:flex;gap:6px;align-items:center;background:rgba(23,32,33,.05);padding:6px;border-radius:10px}.rtool{border:1px solid #dccdb6;background:#fffaf0;border-radius:8px;min-width:38px;height:38px;cursor:pointer;color:#172021;font-weight:800;font-size:1rem}.rtool:hover{border-color:#c4894a;color:#a86c2a}.rtool-size{font-size:.75rem;font-weight:700;color:#6b5e51;padding:0 4px;min-width:48px;text-align:center}.reader-body.kr{max-width:640px;margin:auto;padding:52px 44px 58px;font:1.2rem/1.9 var(--serif);color:#263033}.reader-body.kr p{margin:0 0 1.4em}.reader-body.kr h2{font-size:1.5rem;margin:1.6em 0 .5em;letter-spacing:-.02em}.reader-card.dark{background:#1d2420;border-color:#2a332c}.reader-card.dark .reader-head{background:#232c27;border-color:#34413a}.reader-card.dark .reader-h1{color:#f2eadc}.reader-card.dark .reader-body.kr{color:#e6e0d0}.reader-card.dark .reader-foot{background:#232c27;border-color:#34413a}.reader-card.dark .rtool{background:#2b352f;border-color:#44523f;color:#f2eadc}.reader-card.dark .reader-credit{color:#8a958a}.reader-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 40px;border-top:1px solid #ece1d0;background:#fbf6ec}.reader-credit{margin-left:auto;font-size:.72rem;color:#9a8c78;font-weight:600}.pend{max-width:720px;margin:40px auto 70px;background:#fffdf8;border:1px solid #e3d6c4;border-radius:10px;padding:52px 44px;text-
